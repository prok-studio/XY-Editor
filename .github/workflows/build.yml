name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Absolute All Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf automake libtool m4 pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev liblzma-dev lzma libspatialindex-dev
        pip install --upgrade pip
        pip install "cython==3.0.10" virtualenv buildozer

    - name: Quick Code Check
      run: |
        echo "=== Проверяем файлы на ошибки синтаксиса ==="
        python -m py_compile main.py logic.py
        echo "=== Синтаксических ошибок не обнаружено! ==="

    - name: Deep Clean and Fresh Build APK
      run: |
        export BUILDOZER_ALLOW_KIVY_NEW_DESIGN=1
        buildozer android clean || true
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
